<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumatoria y Productoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <div class="card shadow p-4" style="width: 400px;">
        <h1 class="text-center">Sumatoria y Productoria</h1>
        <form id="form-data">
            <div class="mb-3">
                <label for="function" class="form-label">Ingrese la función (use 'i' como variable):</label>
                <input type="text" id="function" name="function" class="form-control" placeholder="Ej: (i^3 + 2)^2" required>
            </div>
            <div class="mb-3">
                <label for="start" class="form-label">Valor inicial (i):</label>
                <input type="number" id="start" name="start" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="end" class="form-label">Valor final (i):</label>
                <input type="number" id="end" name="end" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" >Calcular</button>
        </form>
        <p id="result" class="mt-3 text-center fw-bold"></p>
        <footer class="text-center mt-3">
            <p>Desarrollado por <strong>Grupo #2</strong></p>
            <ul>
                <li>Kelvin Garcia</li>
                <li>Andy Alvarado</li>
                <li>Melissa Tijerino</li>
                <li>Gerald Araya</li>
            </ul>
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="index.js" ></script>

</body>


</html>
